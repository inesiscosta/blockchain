syntax = "proto3";

package pt.tecnico.blockchainist.contract;

import "common.proto";

// The following option causes top-level messages, enums, and services to be
// defined at the package level, rather than inside an outer class named after
// the .proto file.
option java_multiple_files = true;

message BroadcastRequest {
  Transaction transaction = 1;
}

message BroadcastResponse {
  int32 sequence_number = 1;
}

message DeliverBlockRequest {
  int32 block_number = 1;
}

message DeliverBlockResponse {
  repeated Transaction transaction = 1;
}

message LastBlockNumberRequest {}

message LastBlockNumberResponse {
  int32 block_number = 1;
}

// SequencerService receives transactions, assigns sequence numbers, and lets nodes fetch transactions by sequence number.
service SequencerService {
  // Broadcast submits one transaction to the sequencer. Returns the assigned sequence number.
  rpc Broadcast(BroadcastRequest) returns (BroadcastResponse);

  // DeliverBlock retrieves the block associated with a given sequence number.
  rpc DeliverBlock(DeliverBlockRequest) returns (DeliverBlockResponse);

  // LastBlockNumber retrieves the latest block number.
  rpc LastBlockNumber(LastBlockNumberRequest) returns (LastBlockNumberResponse);
}
